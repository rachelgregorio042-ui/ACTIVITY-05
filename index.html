
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREY | Photography</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="#" class="logo">GREY</a>

        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Pages</a>
            <a href="#">Photography</a>
            <a href="#">Photoshoot</a>
        </nav>

        <a href="#" class="login-btn">Log in ♙</a>
    </header>

    <main class="hero">
        <section class="hero-content">
            <h1>Where creative process happens</h1>

            <p>
                Your creativity, our inspiration<br>
                Whatever your story, set it free.
            </p>

            <a href="#" class="signin-btn">
                <span>Sign in</span>
                <span class="arrow">›</span>
            </a>
        </section>

        <section class="gallery">
            <img src="assets/picture1.jpg"
                 alt="Camera on a clean background"
                 class="gallery-main">

            <div class="gallery-bottom">
                <img src="assets/picture2.jpg"
                     alt="Camera at night">

                <img src="assets/picture3.jpg"
                     alt="Photographer holding a camera">
            </div>
        </section>
    </main>

</body>
</html>
